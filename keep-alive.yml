name: Keep Render Alive

# Pings your Render service so the free tier doesn't sleep (a sleeping bot = late / missed replies).
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables -> New variable
#   Name: RENDER_URL   Value: https://whatsapp-ai-bot-wocm.onrender.com
# Also enable Actions on your fork (Actions tab -> "I understand my workflows, enable them").
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.RENDER_URL || 'https://whatsapp-ai-bot-wocm.onrender.com' }}"
          echo "Pinging $URL/health"
          curl -fsS --max-time 60 "$URL/health" || echo "ping failed, will retry next run"
