services:
  - type: web
    name: whatsapp-ai-bot
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # NOTE: do NOT set RENDER_EXTERNAL_URL here. Render injects your real URL automatically
      # and the bot uses it to keep itself awake.

      # ---- required ----
      - key: PHONE_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ADMIN_KEY          # any long random string; protects /import /agent /stats /clear-sessions
        sync: false

      # ---- YOUR IDENTITY ----
      - key: OWNER_NAME
        sync: false
      - key: ASSISTANT_NAME
        sync: false
      - key: PERSONA
        sync: false
      - key: GOALS
        sync: false
      - key: LANGUAGE_STYLE
        sync: false
      - key: CUSTOM_RULES
        sync: false

      # ---- optional extra AI keys (fallbacks) ----
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false

      # ---- behaviour ----
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MAX_HISTORY
        value: 20
      - key: MAX_PER_HOUR
        value: 60
      - key: HANDOFF_MINUTES
        value: 30
      - key: OWNER_TAKEOVER_PAUSE_MINUTES
        value: 5
      - key: IGNORE_GROUPS
        value: true
      - key: HUMAN_DELAYS      # true = slow, human-like typing delays (replies take 5-60s). false = fast.
        value: false
      - key: AUTO_CLEAR_SESSIONS
        value: false
